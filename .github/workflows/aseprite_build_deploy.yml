name: Build and deploy Aseprite

on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'

env:
  BUILD_TYPE: Release

jobs:
  check-version:
    name: Check latest Aseprite release
    runs-on: ubuntu-latest
    outputs:
      download_url: ${{ steps.version_info.outputs.download_url }}
      latest_tag: ${{ steps.version_info.outputs.latest_tag }}
      should_build: ${{ steps.should_build.outputs.should_build }}
    steps:
      - name: Get latest version info
        id: version_info
        run: |
          data=$(curl -sL https://api.github.com/repos/aseprite/aseprite/releases/latest)
          LATEST_TAG=$(echo "${data}" | jq -r '.tag_name')
          DOWNLOAD_URL=$(echo "${data}" | jq -r '.assets[].browser_download_url')
          VERSION_INFO=$(echo "${data}" | jq -r '.body')

          # Save tag to a file
          echo "${LATEST_TAG}" > ${LATEST_TAG}.txt

          # Modern syntax for outputs
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "download_url=${DOWNLOAD_URL}" >> $GITHUB_OUTPUT
          echo "version_info=${VERSION_INFO}" >> $GITHUB_OUTPUT

      # Force build every run
      - name: Force build
        id: should_build
        run: echo "should_build=true" >> $GITHUB_OUTPUT

      # Create GitHub Release (visible, not draft)
      - name: Create GitHub Release
        id: create_release
        if: steps.should_build.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.latest_tag }}
          name: Release Aseprite ${{ steps.version_info.outputs.latest_tag }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name: Build Aseprite (Windows)
    needs: check-version
    if: ${{ needs.check-version.outputs.should_build }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          choco install ninja 7zip cmake -y

      - name: Add Ninja to PATH
        run: echo "C:\ProgramData\chocolatey\bin" >> $GITHUB_PATH

      - name: Download Skia from cache
        id: skia-cache
        uses: actions/cache@v3
        with:
          path: skia
          key: skia-${{ runner.os }}-cache

      - name: Download Skia if not cached
        if: steps.skia-cache.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/aseprite/skia/releases/download/m81-b607b32047/Skia-${{ runner.os }}-Release-X64.zip -o Skia.zip
          tar -xf Skia.zip -C skia --strip-components=1

      - name: Download Aseprite source
        run: |
          curl -L ${{ needs.check-version.outputs.download_url }} -o Aseprite-source.zip
          tar -xf Aseprite-source.zip -C aseprite
          mkdir -p aseprite/build

      - name: Set up MSVC build environment
        shell: cmd
        run: call "C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

      - name: Configure CMake
        working-directory: aseprite/build
        shell: cmd
        run: cmake -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DLAF_BACKEND=skia -DSKIA_DIR=../../skia -DSKIA_LIBRARY_DIR=../../skia/out/Release-x64 -G Ninja ..

      - name: Build with Ninja
        working-directory: aseprite/build
        run: ninja aseprite

      - name: Prepare portable ZIP
        working-directory: aseprite/build/bin
        run: |
          echo '# This file is here so Aseprite behaves as a portable program' > aseprite.ini
          7z a Aseprite-${{ needs.check-version.outputs.latest_tag }}-${{ runner.os }}.zip *

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.latest_tag }}
          files: aseprite/build/bin/Aseprite-${{ needs.check-version.outputs.latest_tag }}-${{ runner.os }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
